<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff0f4">
<title>给宝宝的小惊喜 ♡</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  color:#9b536d;
  background:radial-gradient(ellipse at 50% 38%,#fffafc 0%,#fff0f4 48%,#f9dce7 100%);
  display:flex;align-items:center;justify-content:center;touch-action:manipulation;
}
.scene{position:relative;width:100%;height:100%;min-height:500px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.glow{position:absolute;width:340px;height:340px;border-radius:50%;background:#fff8fb;filter:blur(3px);opacity:.7}
.float-heart{position:absolute;color:#e9a3ba;opacity:.6;animation:floatUp linear infinite;pointer-events:none}
@keyframes floatUp{from{transform:translateY(110vh) rotate(0deg);opacity:0}15%{opacity:.6}to{transform:translateY(-15vh) rotate(35deg);opacity:0}}
.content{position:relative;z-index:2;width:min(92vw,480px);display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px;transition:opacity .55s,transform .55s}
.envelope-wrap{width:250px;height:180px;position:relative;margin:18px 0 36px;cursor:pointer;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.envelope{position:absolute;inset:0;background:#eaa9bd;border-radius:8px;box-shadow:0 18px 38px #b96b8830;overflow:visible}
.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,#f5c6d5,#e9a0b8);clip-path:polygon(0 0,50% 60%,100% 0);border-radius:8px 8px 0 0;z-index:3;transform-origin:top;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.envelope:after{content:"";position:absolute;inset:0;background:linear-gradient(35deg,#d986a4 0 50%,transparent 50%),linear-gradient(-35deg,#d986a4 0 50%,transparent 50%);clip-path:polygon(0 100%,0 0,50% 58%,100% 0,100% 100%);border-radius:0 0 8px 8px;z-index:4}
.letter{position:absolute;width:86%;height:130px;left:7%;bottom:8px;background:#fffafc;border-radius:5px;box-shadow:0 5px 20px #9c52651a;display:flex;align-items:center;justify-content:center;font-size:20px;letter-spacing:2px;color:#bd6987;transition:transform .85s cubic-bezier(.2,.7,.2,1);z-index:2}
.heartseal{position:absolute;z-index:5;left:50%;top:52%;transform:translate(-50%,-50%);font-size:36px;text-shadow:0 3px 9px #a5537330;animation:heartbeat 1.4s ease-in-out infinite}
@keyframes heartbeat{0%,100%{transform:translate(-50%,-50%) scale(1)}15%{transform:translate(-50%,-50%) scale(1.18)}30%{transform:translate(-50%,-50%) scale(1)}}
.envelope-wrap.open .envelope:before{transform:rotateX(180deg);z-index:1}
.envelope-wrap.open .letter{transform:translateY(-105px);z-index:5}
.envelope-wrap.open .heartseal{opacity:0;transition:opacity .2s}
.hint{font-size:13px;letter-spacing:2px;color:#c08096;animation:softBlink 2s ease-in-out infinite}
@keyframes softBlink{0%,100%{opacity:.5}50%{opacity:1}}
.message{font-size:clamp(28px,7vw,42px);font-weight:600;letter-spacing:3px;color:#c35f83;margin:20px 0 14px;opacity:0;transform:translateY(12px);transition:opacity .8s,transform .8s}
.message.show{opacity:1;transform:translateY(0)}
.subheart{font-size:30px;animation:heartbeat 1.4s infinite}
.continued{font-family:Georgia,serif;font-size:clamp(28px,7vw,42px);font-style:italic;letter-spacing:2px;color:#c35f83;opacity:0;transform:translateY(10px);transition:opacity .8s,transform .8s}
.continued.show{opacity:1;transform:translateY(0)}
.footer{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:0;width:100%;text-align:center;font-size:12px;letter-spacing:1px;color:#c18499;z-index:10}
.taparea{position:absolute;inset:0;z-index:1;cursor:pointer}
.content>*{pointer-events:none}
.envelope-wrap{pointer-events:auto}
.scene[data-stage="1"] .content{transform:translateY(-4px)}
.scene[data-stage="2"] .content{transform:translateY(-10px)}
.scene[data-stage="3"] .content{transform:translateY(-8px)}
</style>
</head>
<body>
<div class="scene" id="scene" data-stage="1">
  <div class="glow"></div>
  <div id="hearts"></div>
  <div class="taparea" id="taparea" aria-label="点击屏幕继续"></div>
  <main class="content">
    <div class="envelope-wrap" id="envelope" aria-label="打开信封">
      <div class="envelope">
        <div class="letter">给最可爱的宝宝 ♡</div>
        <div class="heartseal">♥</div>
      </div>
    </div>
    <div class="hint" id="hint">点一下，拆开这份小惊喜 ♡</div>
    <div class="message" id="message">宝宝我喜欢你呀</div>
    <div class="subheart" id="subheart" style="opacity:0">♡</div>
    <div class="continued" id="continued">to be continued…</div>
  </main>
  <footer class="footer">崔皓禹的宝宝米米制作💗</footer>
</div>
<script>
const scene=document.getElementById('scene'), envelope=document.getElementById('envelope');
const hint=document.getElementById('hint'), message=document.getElementById('message');
const subheart=document.getElementById('subheart'), continued=document.getElementById('continued');
let stage=1;
function next(){
 if(stage===1){
   stage=2;scene.dataset.stage='2';envelope.classList.add('open');
   hint.textContent='再点一下屏幕 ♡';
   setTimeout(()=>{message.classList.add('show');subheart.style.opacity='1'},420);
 }else if(stage===2){
   stage=3;scene.dataset.stage='3';message.classList.remove('show');subheart.style.opacity='0';
   hint.textContent='';envelope.style.opacity='0';envelope.style.transform='translateY(20px)';
   setTimeout(()=>continued.classList.add('show'),250);
 }else{
   // Gentle replay from the beginning
   stage=1;scene.dataset.stage='1';envelope.classList.remove('open');
   envelope.style.opacity='1';envelope.style.transform='';
   message.classList.remove('show');subheart.style.opacity='0';continued.classList.remove('show');
   hint.textContent='点一下，拆开这份小惊喜 ♡';
 }
}
document.getElementById('taparea').addEventListener('click',next);
envelope.addEventListener('click',e=>{e.stopPropagation();if(stage===1)next()});
const hearts=document.getElementById('hearts');
for(let i=0;i<18;i++){
 const h=document.createElement('span');h.className='float-heart';h.textContent=['♡','♥','ღ'][i%3];
 h.style.left=(Math.random()*100)+'%';h.style.fontSize=(12+Math.random()*18)+'px';
 h.style.animationDuration=(8+Math.random()*12)+'s';h.style.animationDelay=(-Math.random()*18)+'s';
 hearts.appendChild(h);
}
</script>
</body>
</html>
